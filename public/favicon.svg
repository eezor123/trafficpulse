<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Subtle Grid lines -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#334155" stroke-width="1" stroke-dasharray="2,2" opacity="0.4" />
  <line x1="32" y1="8" x2="32" y2="56" stroke="#334155" stroke-width="1" stroke-dasharray="2,2" opacity="0.4" />

  <!-- Pulse Path -->
  <path d="M 10 32 L 20 32 L 25 18 L 32 46 L 38 24 L 43 36 L 47 32 L 54 32" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Live Pulse Beacon Dot -->
  <circle cx="47" cy="32" r="3.5" fill="#10b981" filter="url(#glow)" />
  <circle cx="47" cy="32" r="1.5" fill="#ffffff" />
</svg>
